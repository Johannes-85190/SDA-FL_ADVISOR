<body>
<div class="container">

<h2>✈︎ SDA-FL ADVISOR ✈︎</h2>

<div class="card">
<div class="row settings-row">
  <div class="field">
    <label>AVION</label>
    <select id="avion" onchange="majCoutMinute()">
      <option value="E55P">E55P</option>
      <option value="C525">C525</option>
    </select>
  </div>
  <div class="field">
    <label>Mode</label>
    <select id="modeCalcul">
      <option value="TP">TP</option>
      <option value="GIE">GIE</option>
    </select>
  </div>
</div>

<div class="row settings-row">
  <div class="field">
    <label>Prix carburant (€/L)</label>
    <input id="prix" type="number" step="0.01" value="1">
  </div>
  <div class="field">
    <label>Coût (€/minute)</label>
    <input id="minute" type="number">
  </div>
</div>

<div id="sda-mode-tabs">
  <button type="button" id="tab-grid" class="tab-btn active">⌨️ Grille rapide</button>
  <button type="button" id="tab-paste" class="tab-btn">📋 Coller un tableau</button>
</div>

<div id="table-import" style="display:none;">
  <label for="perf-paste">Collez le tableau complet</label>
  <textarea id="perf-paste" rows="8" placeholder="Collez ici le tableau complet copié depuis votre document…"></textarea>
  <button type="button" id="parse-table" class="primary-btn">🪄 Extraire les données</button>
  <div id="parse-status"></div>
</div>

<div id="container"></div>

<div id="sda-row-actions">
  <div class="sda-action-col"><button class="add" onclick="ajouterLigne()">➕ Ajouter une ligne</button></div>
  <div class="sda-action-col"><button type="button" id="sda-reset" class="sda-reset-btn">↺ Réinitialiser</button></div>
</div>
<button class="calc" onclick="calculer()">Calculer</button>

<div id="result"></div>

</div>

<script>

// FL options
function genererOptionsFL(){
  let o=`<option value="">FL</option>`;
  for(let i=180;i<=450;i+=10){
    o+=`<option value="${i}">${i}</option>`;
  }
  return o;
}

// unité conso
function getUniteConso(){
  return avion.value==="E55P" ? "KG" : "LBS";
}

// ajouter ligne
function ajouterLigne(){
  let d=document.createElement("div");
  d.className="card";

  d.innerHTML = `
  <div class="row ligne-compacte">
    <select class="nom">${genererOptionsFL()}</select>
    <input class="tdv" type="number" placeholder="TDV (min)">
    <input class="conso" type="number" placeholder="CONSO (${getUniteConso()})">
    <button class="supprimer" onclick="supprimerLigne(this)">🗑</button>
  </div>
`;

  container.appendChild(d);
}

// supprimer ligne
function supprimerLigne(btn){
  const card = btn.closest("#container .card");
  if(card) card.remove();
}

// MAJ avion
function majCoutMinute(){
  minute.value = avion.value==="E55P" ? 48 : 35;

  document.querySelectorAll(".conso").forEach(i=>{
    i.placeholder = `CONSO (${getUniteConso()})`;
  });
}

// calcul
function calculer(){

  let prix=parseFloat(prixInput.value)||0;
  let minute=parseFloat(minuteInput.value)||0;
  let mode=modeCalcul.value;

  let noms=document.querySelectorAll(".nom");
  let tdvs=document.querySelectorAll(".tdv");
  let consos=document.querySelectorAll(".conso");

  let res=[];

  for(let i=0;i<noms.length;i++){

    let nom=noms[i].value ? `FL${noms[i].value}` : "FL ?";
    let tdv=parseFloat(tdvs[i].value)||0;
    let conso=parseFloat(consos[i].value)||0;

    // conversion litres
    let consoL = avion.value==="E55P"
      ? conso/0.79
      : (conso*0.453592)/0.79;

    let coutTemps = tdv * minute;
    let coutCarb = consoL * prix;
    let total = coutTemps + coutCarb;

    let score;
    let poids = 0.5;

    if(mode==="TP"){
      score = total;
    } else {
      score = consoL + (poids * tdv);
    }

    res.push({
      nom,
      total,
      coutTemps,
      coutCarb,
      consoL,
      score
    });
  }

  let min=Math.min(...res.map(r=>r.score));

  let html = `<div class="card"><strong>${avion.value} — Mode ${mode}</strong></div>`;

  res.forEach(r=>{
    let cls = r.score===min ? "result-item meilleur" : "result-item";

    html+=`
      <div class="${cls}">
        ${r.nom} : ${r.total.toFixed(2)} €
        <div class="details">
          ⏱ ${r.coutTemps.toFixed(1)} € |
          ⛽ ${r.coutCarb.toFixed(1)} € 
        </div>
      </div>
    `;
  });

  result.innerHTML = html;
}

// refs
let prixInput=document.getElementById("prix");
let minuteInput=document.getElementById("minute");
let avion=document.getElementById("avion");
let modeCalcul=document.getElementById("modeCalcul");
let container=document.getElementById("container");
let result=document.getElementById("result");

// init
ajouterLigne();
ajouterLigne();
majCoutMinute();

</script>

<script id="sda-tab-controller">
(function(){
  function initTabs(){
    var gridBtn=document.getElementById('tab-grid');
    var pasteBtn=document.getElementById('tab-paste');
    var importBox=document.getElementById('table-import');
    var grid=document.getElementById('container');
    if(!gridBtn || !pasteBtn || !importBox) return;

    function setMode(mode){
      var quick=(mode==='grid');
      if(importBox) importBox.style.display=quick?'none':'block';
      if(grid) grid.style.display=quick?'':'none';
      gridBtn.classList.toggle('active',quick);
      pasteBtn.classList.toggle('active',!quick);
    }

    gridBtn.onclick=function(e){ e.preventDefault(); e.stopPropagation(); setMode('grid'); };
    pasteBtn.onclick=function(e){ e.preventDefault(); e.stopPropagation(); setMode('paste'); };

    setMode(gridBtn.classList.contains('active') ? 'grid' : 'paste');
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',initTabs);
  }else{
    initTabs();
  }
})();
</script>

<script id="sda-parser-v7">
(function(){
  const btn=document.getElementById('parse-table');
  const ta=document.getElementById('perf-paste');
  const status=document.getElementById('parse-status');
  const container=document.getElementById('container');

  function clean(s){
    return (s||'')
      .replace(/\*\*/g,'')
      .replace(/[|]/g,' ')
      .replace(/\u00a0/g,' ')
      .replace(/\s+/g,' ')
      .trim();
  }

  function minutesFromTime(s){
    const m=s.match(/^(\d{1,2})h(\d{1,2})m$/i) || s.match(/^(\d{1,2}):(\d{2})$/);
    if(!m) return null;
    return Number(m[1])*60+Number(m[2]);
  }

  function parseTable(text){
    const raw=text.replace(/\r/g,'').replace(/\u00a0/g,' ');
    const flMatches=[...raw.matchAll(/\bFL\s*(\d{3})\b/ig)];
    const rows=[];

    for(let i=0;i<flMatches.length;i++){
      const fl=flMatches[i][1];
      const start=flMatches[i].index;
      const end=(i+1<flMatches.length)?flMatches[i+1].index:raw.length;
      const block=raw.slice(start,end);

      // The first TIME/FUEL pair after each FL is always the left-hand
      // performance section. Avg wind and later cruise sections are ignored.
      const timeMatch=block.match(/\b(\d{1,2}h\d{1,2}m|\d{1,2}:\d{2})\b/i);
      if(!timeMatch) continue;

      const timeText=timeMatch[1];
      const tdv=minutesFromTime(timeText);
      if(tdv===null) continue;

      let after=block.slice(timeMatch.index+timeMatch[0].length);

      // Prefer a number explicitly followed by kg/lbs, allowing the unit
      // to be on the following extracted-PDF line.
      let fuelMatch=after.match(/\b(\d+(?:[.,]\d+)?)\s*(?:kg|kgs|lbs|lb)\b/i);

      // If the PDF extraction put "kg" on another line, the explicit unit
      // may occur after whitespace/newlines; the regex above already accepts it.
      // If no unit exists, remove parenthetical time offsets and use the first
      // standalone fuel number after the time.
      if(!fuelMatch){
        const withoutOffsets=after.replace(/\([^)]*\)/g,' ');
        fuelMatch=withoutOffsets.match(/\b(\d+(?:[.,]\d+)?)\b/);
      }

      if(!fuelMatch) continue;

      const fuel=Number(fuelMatch[1].replace(',','.'));
      if(!Number.isFinite(fuel)) continue;

      rows.push({fl,tdv,fuel,timeText});
    }

    // Keep only unique FLs and the first occurrence.
    const seen=new Set();
    return rows.filter(r=>!seen.has(r.fl) && seen.add(r.fl));
  }

  function detectedSection(text){
    const firstFL=text.search(/\bFL\s*\d{3}\b/i);
    const head=firstFL>=0?text.slice(0,firstFL):text;
    const ms=head.search(/Max\s*Speed\s*Cruise/i);
    const lr=head.search(/Long\s*Range\s*Cruise/i);
    const plan=head.search(/Max\s*Speed\s*Cruise\s*\(PLAN\)/i);

    if(plan>=0 && (lr<0 || plan<lr)) return 'MAX SPEED CRUISE (PLAN)';
    if(ms>=0 && (lr<0 || ms<lr)) return 'MAX SPEED CRUISE';
    if(lr>=0) return 'LONG RANGE CRUISE';
    return 'SECTION DE GAUCHE';
  }

  function ensureRows(n){
    // Use the application's own row creation function so the existing
    // calculation engine and styling remain untouched.
    let rows=[...container.querySelectorAll('.card')];
    while(rows.length<n){
      ajouterLigne();
      rows=[...container.querySelectorAll('.card')];
    }
    // Remove surplus rows when switching from a larger pasted table to a smaller one.
    while(rows.length>n){
      rows[rows.length-1].remove();
      rows=rows.slice(0,-1);
    }
    return [...container.querySelectorAll('.card')];
  }

  function fill(rows,data){
    rows.forEach((card,i)=>{
      const row=card.querySelector('.ligne-compacte');
      if(!row) return;
      const d=data[i];
      const sel=row.querySelector('.nom');
      const tdv=row.querySelector('.tdv');
      const fuel=row.querySelector('.conso');

      if(sel){
        sel.value=d.fl;
        sel.dispatchEvent(new Event('change',{bubbles:true}));
      }
      if(tdv){
        tdv.value=d.tdv;
        tdv.dispatchEvent(new Event('input',{bubbles:true}));
        tdv.dispatchEvent(new Event('change',{bubbles:true}));
      }
      if(fuel){
        fuel.value=d.fuel;
        fuel.dispatchEvent(new Event('input',{bubbles:true}));
        fuel.dispatchEvent(new Event('change',{bubbles:true}));
      }
    });
  }

  function showPreview(data,section){
    const old=document.getElementById('sda-preview');
    if(old) old.remove();

    const box=document.createElement('div');
    box.id='sda-preview';
    box.style.cssText='margin-top:10px;padding:10px 12px;border-radius:10px;background:#f4f7f9;border:1px solid #d8e0e6;font-size:14px;line-height:1.55;';
    const title=document.createElement('div');
    title.innerHTML='<strong>✓ '+data.length+' niveau'+(data.length>1?'x':'')+' détecté'+(data.length>1?'s':'')+'</strong> — '+section;
    box.appendChild(title);

    data.forEach(d=>{
      const line=document.createElement('div');
      line.textContent='FL'+d.fl+' — '+d.timeText+' ('+d.tdv+' min) — '+d.fuel+' kg';
      box.appendChild(line);
    });
    status.parentNode.insertBefore(box,status.nextSibling);
  }

  btn?.addEventListener('click',function(){
    const text=ta?.value||'';
    const data=parseTable(text);

    if(!data.length){
      status.style.color='#d93025';
      status.textContent='Aucun niveau exploitable. Le texte doit contenir au moins une ligne FLxxx avec un temps et une consommation.';
      return;
    }

    // The expected operational table has 5 levels. We accept any number,
    // but never silently claim success for missing rows.
    const section=detectedSection(text);
    window.SDA_FL_IMPORTED=data;

    showPreview(data,section);

    const rows=ensureRows(data.length);
    fill(rows,data);

    status.style.color='#159447';
    status.textContent='Données importées dans la grille. Vérifie les valeurs puis clique sur « Calculer ».';

    // Return to the quick grid so the user immediately sees the extracted values.
    const gridBtn=document.getElementById('tab-grid');
    gridBtn?.click();
  });
})();
</script>

<script id="sda-reset-controller">
(function(){
  function resetApp(){
    // Clear pasted table and import status/preview.
    const ta=document.getElementById('perf-paste');
    const st=document.getElementById('parse-status');
    const preview=document.getElementById('sda-preview');
    if(ta) ta.value='';
    if(st) st.textContent='';
    if(preview) preview.remove();
    window.SDA_FL_IMPORTED=[];

    // Reset settings to their normal defaults.
    const avion=document.getElementById('avion');
    const mode=document.getElementById('modeCalcul');
    const prix=document.getElementById('prix');
    const minute=document.getElementById('minute');
    if(avion){ avion.value='E55P'; avion.dispatchEvent(new Event('change',{bubbles:true})); }
    if(mode){ mode.value='TP'; mode.dispatchEvent(new Event('change',{bubbles:true})); }
    if(prix){ prix.value='1'; prix.dispatchEvent(new Event('input',{bubbles:true})); prix.dispatchEvent(new Event('change',{bubbles:true})); }
    if(minute && typeof majCoutMinute==='function'){ majCoutMinute(); }

    // Remove all performance rows, then leave one clean row.
    const container=document.getElementById('container');
    if(container){
      const rows=[...container.querySelectorAll('.ligne-compacte')];
      rows.forEach(row=>{
        const card=row.closest('.card') || row.parentElement;
        if(card && card!==container) card.remove();
        else row.remove();
      });
      if(typeof ajouterLigne==='function') ajouterLigne();
    }

    // Clear any displayed calculation/result area without touching the app's structure.
    document.querySelectorAll('[id*="result"], [class*="result"]').forEach(el=>{
      if(el.id==='sda-preview') return;
      if(el.querySelector && el.querySelector('#avion,#modeCalcul')) return;
      if(el.closest('#container')) return;
      const t=(el.innerText||'').trim();
      if(/Meilleur|E55P\s*[—-]\s*Mode|FL\s*\d{3}/i.test(t)) el.innerHTML='';
    });

    // Return to quick grid.
    document.getElementById('tab-grid')?.click();
    window.scrollTo({top:0,behavior:'smooth'});
  }

  document.addEventListener('click',function(e){
    if(e.target && e.target.closest('#sda-reset')){
      e.preventDefault();
      resetApp();
    }
  });
})();
</script>


<script id="sda-clean-unit-controller">
(function(){
  function wrap(){
    document.querySelectorAll('#container .ligne-compacte').forEach(function(row){
      const sel=row.querySelector('select');
      const tdv=row.querySelector('input.tdv');
      const conso=row.querySelector('input.conso');

      if(sel && !sel.parentElement.classList.contains('sda-fl-wrap')){
        const w=document.createElement('div');
        w.className='sda-fl-wrap';
        sel.parentNode.insertBefore(w,sel);
        w.appendChild(sel);
      }

      function suffix(input, unit, cls){
        if(!input || input.parentElement.classList.contains('sda-unit-wrap')) return;
        const w=document.createElement('div');
        w.className='sda-unit-wrap';
        const u=document.createElement('span');
        u.className='sda-unit';
        u.textContent=unit;
        input.parentNode.insertBefore(w,input);
        w.appendChild(input);
        w.appendChild(u);

        // Keep the input's placeholder clean; the unit is supplied separately.
        if(cls==='tdv') input.setAttribute('placeholder','TDV');
        if(cls==='conso') input.setAttribute('placeholder','CONSO');
      }

      suffix(tdv,'min','tdv');
      suffix(conso,'kg','conso');
    });
  }

  new MutationObserver(wrap).observe(document.body,{childList:true,subtree:true});
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',wrap);
  }else{
    wrap();
  }
  setTimeout(wrap,100);
})();
</script>
